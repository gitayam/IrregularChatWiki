pages_build_output_dir = "dist"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "irregularpedia-db"
database_id = "7768a510-935e-4db4-ac25-808b1416759b"

# KV Namespace for session storage
[[kv_namespaces]]
binding = "SESSIONS"
id = "17796fa8100b419f8df5ad08b2a09d7a"

[vars]
AUTHENTIK_URL = "https://sso.irregularchat.com"
AUTHENTIK_CLIENT_ID = "ps3AS5DcPW43FhB9hAvfUGbQupGRnILnMbi9S5V6"
WIKI_URL = "https://irregularpedia.org"

# Secrets to set via `wrangler secret put`:
# - AUTHENTIK_CLIENT_SECRET
# - FORGEJO_API_TOKEN
# - SIGNAL_BOT_TOKEN
# - SIGNAL_MODERATOR_GROUP_ID
