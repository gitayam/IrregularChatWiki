name: Sync to GitHub

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Push to GitHub
        env:
          GH_USER: ${{ secrets.GH_USER }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd $GITHUB_WORKSPACE || cd /workspace
          git remote add github https://${GH_USER}:${GH_PAT}@github.com/gitayam/IrregularChatWiki.git || true
          git fetch --unshallow || true
          git push github main --force
